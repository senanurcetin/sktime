name: Verify sktime conformal calibration error handling
on:
  push:
    branches:
      - verify/11538-conformal-20261021
permissions:
  contents: read
jobs:
  conformal:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install sktime and focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest "skpro>=2,<2.17" statsmodels ruff
      - name: Run conformal failure regressions
        run: python -m pytest -q sktime/forecasting/tests/test_conformal_residual_failures.py --disable-warnings --maxfail=1 -rs
      - name: Ruff source and tests
        if: always()
        run: python -m ruff check sktime/forecasting/conformal.py sktime/forecasting/tests/test_conformal_residual_failures.py
